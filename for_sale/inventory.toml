# What I'm selling. Edit this file, then run `python3 scripts/build.py`
# (or just push: the site rebuilds on every push and refreshes prices daily).
#
# Each [[item]] is one product. The usual case is a TCGplayer link plus a
# quantity; the name, image, set and market price are filled in automatically
# from TCGplayer's daily price data (via tcgcsv.com).
#
#   [[item]]
#   tcgplayer = "https://www.tcgplayer.com/product/655976/..."  # or just 655976
#   qty = 1
#   price = 250            # optional: your asking price. Without it the price
#                          # is the market price, adjusted by [pricing] below.
#                          # Items with a price set here don't get the
#                          # [discount] code (e.g. things sold at cost).
#   discount = true        # optional: overrides that, letting the discount code
#                          # apply to a set price (or `false` to exclude an item
#                          # priced from TCGplayer).
#   printing = "Foil"      # optional: which TCGplayer price to use when a card
#                          # has Normal and Foil prices. Default: Normal.
#   condition = "Near Mint" # optional, shown on the listing
#   note = "Still sealed"  # optional, shown on the listing
#   kind = "Sealed"        # optional: overrides the automatic Card / Sealed /
#                          # Playmat / Accessory category
#
# Items that aren't on TCGplayer need a name and a price instead:
#
#   [[item]]
#   name = "Custom deck box"
#   price = 15
#   qty = 1
#   image = "images/deck-box.jpg"   # optional: file in for_sale/ or a URL
#   kind = "Accessory"
#
# Set qty = 0 (or delete the item) once something sells.

[seller]
discord = "clesiemo3"
# Optional: your numeric Discord user ID (Settings → Advanced → Developer Mode,
# then right-click your name → Copy User ID). Adds a "Message on Discord" button.
discord_user_id = "211610514319605761"
venmo = "clesiemo3"
# Optional: shown under the title, e.g. "Meetups around St. Louis".
location = ""

[pricing]
# Asking price for items without a `price`: TCGplayer market price × percent,
# rounded to the nearest `round_to` dollars.
percent_of_market = 100
round_to = 1

[discount]
# A code buyers can enter on their list for a percentage off the total of
# eligible items (not items with their own `price`; see above).
# Anyone can see it in the page source, so treat it as a public deal.
# Remove this section (or set code = "") to turn it off.
code = "CAPNJIMMY10"
percent = 10

