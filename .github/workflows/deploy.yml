name: Deploy site

# Copies each page in tools/ into _site/, generates data-driven tools (the For
# Sale page), builds the index from the pages' titles and descriptions, and
# publishes _site/ to GitHub Pages. The daily run refreshes For Sale prices;
# tcgcsv.com updates around 20:00 UTC.

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
