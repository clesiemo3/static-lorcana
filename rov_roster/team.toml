# Rules of Villainy competitive team. After editing, run:
#   uv run python3 rov_roster/update.py   (fetches results, rewrites results.json)
#
# playhub_id: the Play Hub user id (stable even when someone renames).
# elorcana:   the id from the player's elorcana.com/profile/<id> link.
#
# Profile (shown on the player's tab; edits only need a rebuild, not update.py),
# transcribed from the team announcement cards:
#   title, started, inks, favorite_cards, bio (fun facts; results come from
#   the data, so keep tournament results out), outside (what they enjoy when
#   not playing).
# Photos: rov_roster/photos/<id>.jpg is the portrait, <id>-card1.jpg,
# <id>-card2.jpg… the favorite card images. Players without a portrait show
# their initials.

[search]
# Local events: every set championship within `radius_miles` of here, at any
# size, plus every other event there with at least `min_players` players
# (1Ks, box tournaments). DLCs, LCQs and championships are searched worldwide
# regardless of size; CCQs worldwide with at least `min_players`.
name = "St. Louis"
latitude = 38.627
longitude = -90.199
radius_miles = 200
min_players = 30
since = "2025-01-01"

